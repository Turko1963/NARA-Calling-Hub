<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NARA Calling Hub — Every call is talking</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@300;400;500&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#030405}
a{color:#C9D0DD;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #C8FF5A;outline-offset:3px}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@keyframes appear{from{opacity:0;transform:translateY(18px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes lightup{0%,18%{background:#11151C;box-shadow:none}26%,82%{background:var(--c);box-shadow:0 0 22px var(--c),0 0 60px var(--c)}92%,100%{background:#11151C;box-shadow:none}}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.4}49%{opacity:1}72%{opacity:.7}73%{opacity:1}}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
.ping{animation:ping 2.4s ease-out infinite}
.ap{animation:appear 1.4s cubic-bezier(.2,.7,.2,1) both}
.marquee{animation:marquee 60s linear infinite}
.flicker{animation:flicker 6s steps(1) infinite}
.lit{animation:lightup 9s ease-in-out infinite}
.door .secret{filter:blur(9px);opacity:.35;transition:filter .6s,opacity .6s}
.door .seal{transition:opacity .4s}
.door:hover .secret,.door:focus-visible .secret{filter:none;opacity:1}
.door:hover .seal,.door:focus-visible .seal{opacity:0}
.door:hover,.door:focus-visible{border-color:rgba(200,255,90,.45)!important;background:rgba(200,255,90,.04)!important}
.door{transition:border-color .4s,background .4s}
.redact{transition:background .5s,color .5s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="background: #030405; color: #F2F4F8; font-family: 'Geist', system-ui, sans-serif">

<header style="position: fixed; z-index: 20; left: 0; right: 0; top: 0; padding: 22px clamp(16px, 4vw, 48px); display: flex; align-items: center; gap: 14px; background: linear-gradient(#030405, rgba(3,4,5,0))">

</a>
<button type="button" data-theme-toggle aria-label="Switch between light and dark version" style="width: 42px; height: 42px; flex: 0 0 auto; border-radius: 99px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #C9D0DD; display: flex; align-items: center; justify-content: center"><svg class="th-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><svg class="th-moon" aria-hidden="true" style="display: none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
<button aria-label="Language: English" style="height: 42px; padding: 0 14px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #C9D0DD; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.12em">EN</button>

<section id="top" aria-label="Intro" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" style="position: relative; min-height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 20px 140px; box-sizing: border-box">

<span class="ap" style="position: relative; width: 12px; height: 12px; animation-delay: .2s"><span class="ping" style="position: absolute; inset: 0; border-radius: 99px; background: #C8FF5A"></span><span style="position: absolute; inset: 0; border-radius: 99px; background: #C8FF5A; box-shadow: 0 0 20px #C8FF5A"></span></span>
<span class="ap" style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.32em; color: #9AA2B3; animation-delay: .6s">SIGNAL INTERCEPTED · 19:00:12</span>
<h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(56px, 11vw, 168px); line-height: 0.92; letter-spacing: -0.035em; text-shadow: 0 0 30px #030405, 0 0 60px #030405, 0 0 90px #030405">
<span class="ap" style="display: block; animation-delay: 1s">Every call</span>
<span class="ap" style="display: block; animation-delay: 1.5s">is talking.</span>
<span class="ap" style="display: block; font-style: italic; color: #7F889B; animation-delay: 2.4s">Few are <span class="flicker" style="color: #C8FF5A">heard</span>.</span>
</h1>
<span class="ap" style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.28em; color: #9AA2B3; animation-delay: 3.2s">MOVE YOUR LIGHT THROUGH THE DARK</span>
</div>

<div aria-label="Intercepted signals" style="position: absolute; left: 0; right: 0; bottom: 34px; overflow: hidden; border-top: 1px solid rgba(255,255,255,0.06); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 14px 0">
<div class="marquee" style="display: flex; width: max-content">
<sc-for list="{{ marquee }}" as="m" hint-placeholder-count="8">
<span style="display: flex; align-items: center; gap: 14px; padding: 0 30px; white-space: nowrap; border-right: 1px solid rgba(255,255,255,0.08)">
<span style="{{ m.tagStyle }}">{{ m.tag }}</span>
<span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 19px; color: #C9D0DD">{{ m.text }}</span>
</span>
</sc-for>
</div>
</div>
</section>

<section aria-labelledby="dec-h" style="position: relative; padding: clamp(80px, 12vw, 160px) 20px; display: flex; flex-direction: column; align-items: center; gap: 48px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; max-width: 900px">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.32em; color: #9AA2B3">CASE FILE 29E9 · 00:00:28 OF AUDIO</span>
<h2 id="dec-h" style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(44px, 7vw, 104px); line-height: 0.95; letter-spacing: -0.03em">This call looked fine.<br><span style="font-style: italic; color: #FF7A6B">It wasn’t.</span></h2>
</div>

<div style="width: 100%; max-width: 860px; box-sizing: border-box; position: relative; overflow: hidden; border-radius: 28px; border: 1px solid rgba(255,255,255,0.1); background: #07090C; padding: clamp(20px, 4vw, 40px); display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 12px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: #7F889B"><span style="{{ statusDot }}"></span><span>{{ statusText }}</span><span style="margin-left: auto">RETENTION · AGENT E.A.</span></div>
<sc-for list="{{ lines }}" as="l" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: start">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #7F889B; padding-top: 6px">{{ l.time }}</span>

<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #9AA2B3">{{ l.who }}</span>
<span class="redact" style="{{ l.textStyle }}">{{ l.text }}</span>
<sc-if value="{{ l.flagged }}" hint-placeholder-val="{{ false }}"><span style="{{ l.flagStyle }}">{{ l.flag }}</span></sc-if>
</div>
</div>
</sc-for>
<div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.07)">
<button onClick="{{ toggleDecrypt }}" style="{{ decBtnStyle }}">{{ decLabel }}</button>
<span style="font-size: 14px; color: #9AA2B3">{{ decHint }}</span>
</div>
</div>
</section>

<section aria-labelledby="worlds-h" style="padding: clamp(60px, 10vw, 140px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; align-items: center; gap: 48px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.32em; color: #9AA2B3">FOUR WORLDS · ONE PLATFORM</span>
<h2 id="worlds-h" style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(44px, 7vw, 104px); line-height: 0.95; letter-spacing: -0.03em">Four rooms.<br><span style="font-style: italic; color: #7F889B">All of them sealed.</span></h2>

<sc-for list="{{ worlds }}" as="w" hint-placeholder-count="4">
<button class="door" aria-label="{{ w.aria }}" style="position: relative; min-height: 380px; text-align: left; padding: 30px 26px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.09); background: rgba(255,255,255,0.02); color: #F2F4F8; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

<div style="display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; max-width: 900px">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.32em; color: #9AA2B3">THE FLOOR</span>
<h2 id="floor-h" style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(44px, 7vw, 104px); line-height: 0.95; letter-spacing: -0.03em">Then the lights<br><span style="font-style: italic; color: #C8FF5A">come on.</span></h2>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #9AA2B3; max-width: 560px">Every agent. Every call. The ones who need you start to glow — before the customer hangs up.</p>

<div style="position: relative; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center">
<a href="#enter" style="height: 58px; padding: 0 30px; border-radius: 99px; background: #C8FF5A; color: #0B0F02; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 500; box-shadow: 0 0 60px rgba(200,255,90,0.35)">Try 5 calls free<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<a href="login.html" style="height: 58px; padding: 0 28px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.16); display: flex; align-items: center; font-size: 16px">Login</a>

</section>

<footer style="padding: 28px clamp(16px, 4vw, 48px); border-top: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #7F889B">
<span style="font-family: 'Instrument Serif', serif; font-size: 22px; color: #F2F4F8">NARA Calling Hub <span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.22em; color: #C8FF5A">super AI</span></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; margin-left: auto">© 2026 · LISTENING SINCE THE FIRST RING</span>
</footer>
</div>
</template>
<script>
/* Light theme engine: maps every colour in a style declaration to its light-version equivalent.
   Neutrals flip lightness (keeping their slight blue bias), accents keep their hue but get darker
   wherever they are used as text, strokes or borders, so they stay readable on white. */
const __TH = (() => {
  const RE = /#[0-9a-fA-F]{8}\b|#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b|rgba?\([^)]*\)/g;
  const TEXTISH = { 'color': 1, 'stroke': 1, 'fill': 1, 'stop-color': 1, 'caret-color': 1, 'outline': 1, 'outline-color': 1, 'accent-color': 1, '-webkit-text-fill-color': 1 };
  const memo = new Map();
  function parse(c) {
    if (c[0] === '#') {
      let h = c.slice(1);
      if (h.length === 3) h = h.split('').map((x) => x + x).join('');
      const n = parseInt(h.slice(0, 6), 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255, a: h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1 };
    }
    const p = c.slice(c.indexOf('(') + 1, -1).split(/[\s,\/]+/).filter(Boolean).map(parseFloat);
    return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
  }
  function hsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    if (mx === mn) return [0, 0, l];
    const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    let h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h / 6, s, l];
  }
  function rgb(h, s, l) {
    if (s === 0) { const v = Math.round(l * 255); return [v, v, v]; }
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = (t) => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return [Math.round(f(h + 1 / 3) * 255), Math.round(f(h) * 255), Math.round(f(h - 1 / 3) * 255)];
  }
  function out(r, g, b, a) { a = Math.round(a * 1000) / 1000; return a >= 1 ? '#' + [r, g, b].map((x) => x.toString(16).padStart(2, '0')).join('') : 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }
  function accentOf(c) { const [, s, l] = hsl(c.r, c.g, c.b); return s > 0.35 && l >= 0.2 && l <= 0.89; }
  function color(str, prop, keepText) {
    const c = parse(str);
    const [h, s, l] = hsl(c.r, c.g, c.b);
    const textish = !!TEXTISH[prop];
    if (s > 0.35 && l >= 0.2 && l <= 0.89) {
      const deg = h * 360;
      if (deg >= 60 && deg <= 110) {
        if (textish) return out(22, 133, 177, c.a < 0.5 ? Math.min(1, c.a * 1.6) : c.a);
        if (prop.indexOf('border') === 0) return out(41, 175, 229, Math.min(1, c.a * 1.25));
        if (prop === 'box-shadow' || prop === 'text-shadow') return out(41, 175, 229, c.a * 0.55);
        return out(41, 175, 229, c.a);
      }
      if (deg > 172 && deg <= 200 && textish) { const [r, g, b] = rgb(172 / 360, Math.min(s, 0.95), Math.min(l, 0.32)); return out(r, g, b, c.a < 0.5 ? Math.min(1, c.a * 1.6) : c.a); }
      if (textish) { const [r, g, b] = rgb(h, Math.min(s, 0.95), Math.min(l, 0.34)); return out(r, g, b, c.a < 0.5 ? Math.min(1, c.a * 1.6) : c.a); }
      if (prop.indexOf('border') === 0) { const [r, g, b] = rgb(h, s, Math.min(l, 0.46)); return out(r, g, b, Math.min(1, c.a * 1.25)); }
      if (prop === 'box-shadow' || prop === 'text-shadow') return out(c.r, c.g, c.b, c.a * 0.55);
      return str;
    }
    if (keepText && textish) return str;
    if (prop === 'box-shadow' && l < 0.3 && c.a < 1) return out(20, 26, 38, c.a * 0.2);
    const [r, g, b] = rgb(h, s, Math.min(0.98, 1 - l));
    return out(r, g, b, c.a);
  }
  function value(v, prop, keepText) { return v.replace(RE, (m) => color(m, prop, keepText)); }
  function block(text) {
    const hit = memo.get(text); if (hit !== undefined) return hit;
    let keep = false;
    const bg = /(?:^|;)\s*background(?:-color)?\s*:\s*([^;]+)/i.exec(text);
    if (bg && !/gradient/i.test(bg[1])) { const c = (bg[1].match(RE) || [])[0]; if (c) { const p = parse(c); if (p.a > 0.9 && accentOf(p)) keep = true; } }
    const res = text.replace(/([a-zA-Z-]+)(\s*:\s*)([^;{}]+)/g, (m, prop, sep, val) => {
      if (!RE.test(val)) { RE.lastIndex = 0; return m; }
      RE.lastIndex = 0;
      return prop + sep + value(val, prop.toLowerCase(), keep);
    });
    if (memo.size > 5000) memo.clear();
    memo.set(text, res);
    return res;
  }
  function css(text) { return text.replace(/\{([^{}]*)\}/g, (m, body) => '{' + block(body) + '}'); }
  function attr(name, v) { return (name === 'style') ? block(v) : (name === 'stroke' || name === 'fill' || name === 'stop-color') ? value(v, name, false) : v; }
  function load() { try { return localStorage.getItem('mycc-theme') === 'light'; } catch (e) { return false; } }
  function save(light) { try { localStorage.setItem('mycc-theme', light ? 'light' : 'dark'); } catch (e) {} }
  return { block, css, attr, value, load, save };
})();

/* Tiny template runtime: renders <template id="tpl"> with {{holes}}, <sc-for>, <sc-if> and on* handlers,
   then patches the live DOM in place so running CSS animations are not restarted on each update. */

#__dial .demo{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:16px;border:1px dashed rgba(200,255,90,.55);background:rgba(200,255,90,.06);color:#C8FF5A;font-size:14px;font-weight:500}
#__dial .demo:hover{background:rgba(200,255,90,.12)}
#__dial .golive{height:52px;border-radius:99px;border:0;background:#C8FF5A;color:#0B0F02;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
#__dial .sr,#__dial-tab .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.st-avail{background:#3DD68C}.st-call{background:#C8FF5A}.st-wrap{background:#5EE6F0}.st-break{background:#FFC24B}.st-lunch{background:#FF9F43}.st-rest{background:#F7D154}.st-coach{background:#A08BFF}.st-meet{background:#7FA8FF}.st-train{background:#E58BFF}.st-off{background:#6B7385}
@media (max-width:560px){#__dial-tab{top:auto;bottom:96px;transform:none}}
@media (prefers-reduced-motion:reduce){#__dial,#__dial *{animation:none!important;transition:none!important}}
