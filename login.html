<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NARA Calling Hub — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@300;400;500&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#030405}
a{color:#C9D0DD;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #C8FF5A;outline-offset:3px}
input{font-family:inherit}
input::placeholder{color:#6B7385}
.field:focus-within{border-color:rgba(200,255,90,.6)!important;box-shadow:0 0 0 4px rgba(200,255,90,.08)}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes travel{0%{left:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:100%;opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.93);opacity:.7}50%{transform:scale(1.05);opacity:1}}
@keyframes caret{50%{opacity:0}}
@keyframes appear{from{opacity:0;transform:translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.ping{animation:ping 2.4s ease-out infinite}
.pulse{animation:travel 2.2s ease-in-out infinite}
.spin{animation:spin 40s linear infinite}
.breathe{animation:breathe 4s ease-in-out infinite}
.caret{animation:caret 1s steps(1) infinite}
.ap{animation:appear 1.2s cubic-bezier(.2,.7,.2,1) both}
.scan{animation:scan 1.1s ease-in-out infinite}
.wave span{animation:wave 1s ease-in-out infinite;transform-origin:center}
.ghost:hover{background:rgba(255,255,255,.06)!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div onMouseMove="{{ onMove }}" style="position: relative; min-height: 100vh; overflow: hidden; background: #030405; color: #F2F4F8; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column">
<p aria-hidden="true" style="position: absolute; inset: 0; margin: 0; padding: 40px; font-family: 'Geist Mono', monospace; font-size: 14px; line-height: 2.1; color: rgba(242,244,248,0.035); overflow: hidden; text-align: justify; user-select: none; pointer-events: none">{{ noise }}</p>
<p aria-hidden="true" style="{{ lightStyle }}">{{ noise }}</p>

<header style="position: relative; z-index: 2; padding: 22px clamp(16px, 4vw, 48px); display: flex; align-items: center; gap: 14px">
<a href="index.html" aria-label="NARA Calling Hub home" style="display: flex; align-items: center; gap: 12px; margin-right: auto; color: #F2F4F8">
<span style="width: 30px; height: 30px; border-radius: 99px; border: 1.5px solid #F2F4F8; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 99px; background: #C8FF5A"></span></span>
<span style="display: flex; flex-direction: column; line-height: 1"><span style="font-family: 'Instrument Serif', serif; font-size: 27px; letter-spacing: -0.01em">NARA Calling Hub</span><span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.26em; color: #C8FF5A; margin-top: 3px">super AI</span></span>
</a>
<button type="button" data-theme-toggle aria-label="Switch between light and dark version" style="width: 42px; height: 42px; flex: 0 0 auto; border-radius: 99px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #C9D0DD; display: flex; align-items: center; justify-content: center"><svg class="th-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><svg class="th-moon" aria-hidden="true" style="display: none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
<button aria-label="Language: English" style="height: 42px; padding: 0 14px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #C9D0DD; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.12em">EN</button>
<span style="font-size: 14px; color: #9AA2B3">New here?</span>
<a href="index.html" style="height: 42px; padding: 0 18px; border-radius: 99px; border: 1px solid rgba(200,255,90,0.45); color: #C8FF5A; display: flex; align-items: center; font-size: 14px">Try 5 calls free</a>
</header>

<div style="position: relative; z-index: 1; flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 40px; padding: 20px clamp(16px, 5vw, 72px) 48px; box-sizing: border-box">

<section aria-label="NARA Calling Hub is listening" style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 40px">
<div class="ap" style="display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.32em; color: #9AA2B3">LISTEN · UNDERSTAND · ACT</span>
<h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(52px, 7vw, 108px); line-height: 0.92; letter-spacing: -0.035em; text-shadow: 0 0 40px #030405, 0 0 80px #030405">Welcome back.<br><span style="font-style: italic; color: #7F889B">The floor is <span style="color: #C8FF5A">listening</span>.</span></h1>
</div>

<div aria-hidden="true" class="ap" style="position: relative; display: flex; align-items: center; justify-content: space-between; max-width: 560px; animation-delay: .4s">
<div style="position: absolute; left: 60px; right: 60px; top: 50%; height: 1px; background: linear-gradient(90deg, rgba(94,230,240,0.5), rgba(200,255,90,0.6), rgba(255,194,75,0.5))">
<span class="pulse" style="position: absolute; top: -3px; width: 7px; height: 7px; border-radius: 99px; background: #C8FF5A; box-shadow: 0 0 12px #C8FF5A"></span>
<span class="pulse" style="position: absolute; top: -3px; width: 7px; height: 7px; border-radius: 99px; background: #C8FF5A; box-shadow: 0 0 12px #C8FF5A; animation-delay: 1.1s"></span>
</div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px">
<span style="width: 84px; height: 84px; border-radius: 99px; background: #071114; border: 1.5px solid rgba(94,230,240,0.7); box-shadow: 0 0 40px rgba(94,230,240,0.25); display: flex; align-items: center; justify-content: center; color: #5EE6F0"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><rect x="3" y="15" width="4" height="6" rx="1.5"></rect><rect x="17" y="15" width="4" height="6" rx="1.5"></rect></svg></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.24em; color: #5EE6F0">AGENT</span>
</div>
<div style="position: relative; width: 170px; height: 170px">
<span class="ping" style="position: absolute; inset: 40px; border-radius: 50%; border: 1px solid rgba(200,255,90,0.5)"></span>
<svg class="spin" viewBox="0 0 170 170" style="position: absolute; inset: 0; width: 100%; height: 100%"><sc-for list="{{ ticks }}" as="t" hint-placeholder-count="60"><line x1="{{ t.x1 }}" y1="{{ t.y1 }}" x2="{{ t.x2 }}" y2="{{ t.y2 }}" stroke="{{ t.c }}" stroke-width="2" stroke-linecap="round"></line></sc-for></svg>
<span class="breathe" style="position: absolute; inset: 38px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(200,255,90,0.6), rgba(200,255,90,0.1) 60%, rgba(200,255,90,0) 74%)"></span>
<span style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<span class="wave" style="display: flex; align-items: center; gap: 3px; height: 26px"><sc-for list="{{ wave }}" as="b" hint-placeholder-count="7"><span style="{{ b }}"></span></sc-for></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: 0.24em; color: #E6FFB0">AI ANALYSIS</span>
</span>
</div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px">
<span style="width: 84px; height: 84px; border-radius: 99px; background: #14100A; border: 1.5px solid rgba(255,194,75,0.7); box-shadow: 0 0 40px rgba(255,194,75,0.2); display: flex; align-items: center; justify-content: center; color: #FFC24B"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.24em; color: #FFC24B">CLIENT</span>
</div>
</div>

<dl class="ap" style="margin: 0; display: flex; gap: clamp(20px, 4vw, 48px); flex-wrap: wrap; animation-delay: .8s">
<div style="display: flex; flex-direction: column-reverse; gap: 4px"><dt style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #9AA2B3">ACCURACY</dt><dd style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 48px; line-height: 1">98.4%</dd></div>
<div style="display: flex; flex-direction: column-reverse; gap: 4px"><dt style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #9AA2B3">CALLS PROCESSED</dt><dd style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 48px; line-height: 1">2.1M+</dd></div>
<div style="display: flex; flex-direction: column-reverse; gap: 4px"><dt style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #9AA2B3">LATENCY</dt><dd style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 48px; line-height: 1">&lt;1s</dd></div>
</dl>
<span style="display: flex; align-items: center; gap: 10px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #9AA2B3"><span style="position: relative; width: 8px; height: 8px"><span class="ping" style="position: absolute; inset: 0; border-radius: 99px; background: #3DD68C"></span><span style="position: absolute; inset: 0; border-radius: 99px; background: #3DD68C"></span></span>ALL SYSTEMS OPERATIONAL</span>
</section>

<section aria-labelledby="signin-h" class="ap" style="flex: 0 1 460px; min-width: 300px; box-sizing: border-box; position: relative; border-radius: 32px; padding: clamp(24px, 3vw, 40px); background: rgba(10,12,16,0.82); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 50px 120px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: flex; flex-direction: column; gap: 22px; animation-delay: .3s">

<sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.3em; color: #C8FF5A">WELCOME BACK</span>
<h2 id="signin-h" style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 42px; line-height: 1.02; letter-spacing: -0.02em">Sign in to <span style="font-style: italic">NARA Calling Hub</span><span class="caret" aria-hidden="true" style="color: #C8FF5A">|</span></h2>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.24em; color: #9AA2B3">SIGN IN AS</span>
<div role="radiogroup" aria-label="Sign in as" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ roles }}" as="r" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{ r.checked }}" onClick="{{ r.pick }}" style="{{ r.style }}"><span style="font-size: 15px; font-weight: 500">{{ r.label }}</span><span style="font-size: 11px; line-height: 1.3; color: #9AA2B3">{{ r.hint }}</span></button></sc-for>
</div>
</div>

<div role="tablist" aria-label="Sign-in method" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 99px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)">
<sc-for list="{{ modes }}" as="m" hint-placeholder-count="2"><button role="tab" aria-selected="{{ m.selected }}" onClick="{{ m.pick }}" style="{{ m.style }}">{{ m.label }}</button></sc-for>
</div>

<sc-if value="{{ isPassword }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.24em; color: #9AA2B3">EMAIL ADDRESS</span>
<span class="field" style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 16px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.12); transition: border-color .2s, box-shadow .2s"><input type="email" autocomplete="username" placeholder="you@company.com" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #F2F4F8; font-size: 16px"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7F889B" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></span></label>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.24em; color: #9AA2B3">PASSWORD</span>
<span class="field" style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px 0 16px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.12); transition: border-color .2s, box-shadow .2s"><input type="{{ pwType }}" autocomplete="current-password" placeholder="••••••••" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #F2F4F8; font-size: 16px; letter-spacing: 0.08em"><button type="button" class="ghost" onClick="{{ togglePw }}" aria-label="{{ pwAria }}" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: #9AA2B3; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle><sc-if value="{{ pwShown }}" hint-placeholder-val="{{ false }}"><path d="M3 3l18 18"></path></sc-if></svg></button></span></label>
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px">
<label style="display: flex; align-items: center; gap: 10px; color: #C9D0DD; margin-right: auto"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #C8FF5A">Remember me</label>
<a href="#" style="color: #C8FF5A">Forgot password?</a>
</div>
</div>
</sc-if>

<sc-if value="{{ isOtp }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.24em; color: #9AA2B3">PHONE NUMBER</span>
<span class="field" style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px 0 16px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.12)"><input type="tel" autocomplete="tel" placeholder="+1 555 000 0000" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #F2F4F8; font-size: 16px"><button type="button" onClick="{{ sendCode }}" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(200,255,90,0.4); background: transparent; color: #C8FF5A; font-size: 13px; white-space: nowrap">{{ sendLabel }}</button></span></label>
<sc-if value="{{ codeSent }}" hint-placeholder-val="{{ false }}">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px"><legend style="padding: 0 0 8px; font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.24em; color: #9AA2B3">6-DIGIT CODE</legend>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ digits }}" as="d" hint-placeholder-count="6"><input class="field" inputmode="numeric" maxlength="1" aria-label="{{ d }}" style="height: 56px; min-width: 0; text-align: center; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.12); color: #F2F4F8; font-family: 'Geist Mono', monospace; font-size: 22px; outline: none"></sc-for>
</div>
</fieldset>
</sc-if>
</div>
</sc-if>

<button type="button" onClick="{{ submit }}" style="position: relative; overflow: hidden; height: 58px; border-radius: 99px; border: 0; background: #C8FF5A; color: #0B0F02; font-size: 15px; font-weight: 500; letter-spacing: 0.16em; box-shadow: 0 0 50px rgba(200,255,90,0.3)">{{ submitLabel }}</button>

<div style="display: flex; align-items: center; gap: 14px; font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.24em; color: #7F889B"><span style="flex: 1; height: 1px; background: rgba(255,255,255,0.08)"></span>OR<span style="flex: 1; height: 1px; background: rgba(255,255,255,0.08)"></span></div>

<button type="button" class="ghost" style="height: 54px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #F2F4F8; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>Continue with Google</button>
</sc-if>

<sc-if value="{{ isVerifying }}" hint-placeholder-val="{{ false }}">
<div role="status" style="min-height: 520px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center">
<div style="position: relative; width: 120px; height: 120px">
<span class="ping" style="position: absolute; inset: 20px; border-radius: 50%; border: 1px solid #C8FF5A"></span>
<span class="ping" style="position: absolute; inset: 20px; border-radius: 50%; border: 1px solid #C8FF5A; animation-delay: .8s"></span>
<span class="breathe" style="position: absolute; inset: 30px; border-radius: 50%; background: radial-gradient(circle, rgba(200,255,90,0.7), rgba(200,255,90,0) 70%)"></span>
</div>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.3em; color: #C8FF5A">AUTHENTICATING</span>
<div style="width: 220px; height: 3px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden"><div class="scan" style="width: 40%; height: 100%; border-radius: 99px; background: #C8FF5A"></div></div>
<span style="font-size: 14px; color: #9AA2B3">Tuning in to your floor…</span>
</div>
</sc-if>

<sc-if value="{{ isGranted }}" hint-placeholder-val="{{ false }}">
<div role="status" class="ap" style="min-height: 520px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center">
<span style="width: 84px; height: 84px; border-radius: 99px; background: #C8FF5A; color: #0B0F02; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 60px rgba(200,255,90,0.5)"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.3em; color: #C8FF5A">ACCESS GRANTED</span>
<sc-if value="{{ isAgent }}" hint-placeholder-val="{{ false }}">
<h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 44px; line-height: 1.05">Your calls are <span style="font-style: italic">ready</span>.</h2>
<p style="margin: 0; font-size: 15px; color: #9AA2B3">Signed in as Maged Alnajar · agent · Ext. 1002</p>
<a href="agent-home.html" style="height: 54px; padding: 0 26px; border-radius: 99px; background: #F2F4F8; color: #050608; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500">Start my day<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</sc-if>
<sc-if value="{{ isManager }}" hint-placeholder-val="{{ true }}">
<h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 44px; line-height: 1.05">Your floor is <span style="font-style: italic">live</span>.</h2>
<p style="margin: 0; font-size: 15px; color: #9AA2B3">{{ grantedLine }}</p>
<a href="dashboard.html" style="height: 54px; padding: 0 26px; border-radius: 99px; background: #F2F4F8; color: #050608; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500">Enter the floor<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</sc-if>
<button type="button" onClick="{{ reset }}" style="border: 0; background: transparent; color: #9AA2B3; font-size: 13px; height: 36px">Not you? Sign out</button>
</div>
</sc-if>

<span style="text-align: center; font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #7F889B">© 2026 NARA CALLING HUB · SECURE · ENCRYPTED · PRIVATE</span>

#__dial .callbtn{height:60px;border-radius:99px;border:0;background:#3DD68C;color:#04140C;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 40px rgba(61,214,140,.3)}
#__dial .endbtn{height:60px;border-radius:99px;border:0;background:#FF5A4E;color:#1A0503;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
#__dial .why{font-size:13px;color:#FFC24B;text-align:center}
#__dial .row{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02);text-align:left}
#__dial .row:hover{background:rgba(255,255,255,.05)}
#__dial .row .ic{width:34px;height:34px;flex:0 0 auto;border-radius:99px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);color:#C9D0DD}
#__dial .row .ic.in{color:#5EE6F0}#__dial .row .ic.out{color:#C8FF5A}#__dial .row .ic.miss{color:#FF7A6B}
#__dial .row .tx{display:flex;flex-direction:column;gap:2px;min-width:0;margin-right:auto}
#__dial .row .tx b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#__dial .row .tx span{font-size:12px;color:#9AA2B3}
#__dial .row .go{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#3DD68C;white-space:nowrap}
#__dial .card{border-radius:22px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);padding:18px;display:flex;flex-direction:column;gap:12px}
#__dial .card.live{border-color:rgba(61,214,140,.45);background:rgba(61,214,140,.06)}
#__dial .card.ring{border-color:rgba(94,230,240,.45);background:rgba(94,230,240,.06)}
#__dial .card.pause{border-color:rgba(255,194,75,.45);background:rgba(255,194,75,.06)}
#__dial .card.coach{border-color:rgba(160,139,255,.5);background:rgba(160,139,255,.07)}
#__dial .eb{font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.22em;color:#9AA2B3}
#__dial .eb.g{color:#3DD68C}#__dial .eb.c{color:#5EE6F0}#__dial .eb.a{color:#FFC24B}#__dial .eb.p{color:#B7A6FF}
#__dial .big{font-size:24px;font-weight:400;letter-spacing:-.01em}
#__dial .clock{font-family:'Geist Mono',ui-monospace,monospace;font-size:44px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
#__dial .sub{font-size:13px;color:#A3ABBB;line-height:1.45}
#__dial .wv{display:flex;align-items:center;gap:3px;height:28px}
#__dial .wv span{display:block;width:3px;border-radius:2px;background:#3DD68C;animation:__dwave 1s ease-in-out infinite;transform-origin:center}
@keyframes __dwave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes __dring{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.2);opacity:0}}
#__dial .ringdot{position:relative;width:12px;height:12px}
#__dial .ringdot::before,#__dial .ringdot::after{content:"";position:absolute;inset:0;border-radius:99px;background:#5EE6F0}
#__dial .ringdot::before{animation:__dring 1.2s ease-out infinite}
#__dial .tip{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(200,255,90,.07);border:1px solid rgba(200,255,90,.3);font-size:14px;line-height:1.45}
#__dial .tip i{font-style:normal;font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.2em;color:#C8FF5A;padding-top:3px;white-space:nowrap}
#__dial .ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#__dial .ctl button{height:68px;border-radius:16px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#C9D0DD}
#__dial .ctl button:hover{background:rgba(255,255,255,.07)}
#__dial .ctl button[aria-pressed="true"]{background:#F2F4F8;color:#050608;border-color:#F2F4F8}
#__dial .ctl button.help[aria-pressed="true"]{background:#A08BFF;border-color:#A08BFF;color:#0D0820}
#__dial .ctl button.rec[aria-pressed="true"]{background:#FF5A4E;border-color:#FF5A4E;color:#1A0503}
#__dial .chips{display:flex;flex-wrap:wrap;gap:8px}
#__dial .chips button{height:40px;padding:0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.14);background:transparent;font-size:13px}
#__dial .chips button[aria-pressed="true"]{background:#C8FF5A;border-color:#C8FF5A;color:#0B0F02}
#__dial textarea{width:100%;box-sizing:border-box;min-height:80px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#0E1117;color:#F2F4F8;font:inherit;font-size:14px;padding:10px 12px;resize:vertical}
#__dial .primary{height:52px;border-radius:99px;border:0;background:#C8FF5A;color:#0B0F02;font-size:15px;font-weight:600}
#__dial .ghost{height:46px;border-radius:99px;border:1px solid rgba(255,255,255,.16);background:transparent;font-size:14px}
#__dial .ft{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border-top:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.07)}
#__dial .ft div{background:#0A0C10;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
#__dial .ft span{font-size:11px;color:#9AA2B3}
#__dial .ft b{font-family:'Geist Mono',ui-monospace,monospace;font-weight:400;font-size:14px}
#__dial .priv{display:flex;align-items:center;gap:6px;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;color:#9AA2B3}
#__dial .demo{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:16px;border:1px dashed rgba(200,255,90,.55);background:rgba(200,255,90,.06);color:#C8FF5A;font-size:14px;font-weight:500}
#__dial .demo:hover{background:rgba(200,255,90,.12)}
#__dial .golive{height:52px;border-radius:99px;border:0;background:#C8FF5A;color:#0B0F02;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
#__dial .sr,#__dial-tab .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.st-avail{background:#3DD68C}.st-call{background:#C8FF5A}.st-wrap{background:#5EE6F0}.st-break{background:#FFC24B}.st-lunch{background:#FF9F43}.st-rest{background:#F7D154}.st-coach{background:#A08BFF}.st-meet{background:#7FA8FF}.st-train{background:#E58BFF}.st-off{background:#6B7385}
@media (max-width:560px){#__dial-tab{top:auto;bottom:96px;transform:none}}
@media (prefers-reduced-motion:reduce){#__dial,#__dial *{animation:none!important;transition:none!important}}
