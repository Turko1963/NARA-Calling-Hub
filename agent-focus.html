<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NARA Calling Hub — Agent focus mode</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#030405}
a{color:#9AA2B3;text-decoration:none}a:hover{color:#F2F4F8}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #C8FF5A;outline-offset:3px}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.75}50%{transform:scale(1.04);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.5);opacity:0}}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes riseB{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fillA{from{width:0}to{width:100%}}
@keyframes fillB{from{width:0}to{width:100%}}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
.breathe{animation:breathe 4s ease-in-out infinite}
.spin{animation:spin 36s linear infinite}
.ripple{animation:ripple 4s ease-out infinite}
.wave span{animation:wave 1s ease-in-out infinite;transform-origin:center}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.ping{animation:ping 2s ease-out infinite}
.ghost:hover{background:rgba(255,255,255,.06)!important;color:#F2F4F8!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div data-focus-page style="min-height: 100vh; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 38%, #0E1410 0%, #05070A 45%, #030405 75%); color: #F2F4F8; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="position: relative; z-index: 2; padding: 22px 32px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 14px; border-radius: 99px; background: rgba(200,255,90,0.08); border: 1px solid rgba(200,255,90,0.25)">
<span style="position: relative; width: 8px; height: 8px"><span class="ping" style="position: absolute; inset: 0; border-radius: 99px; background: #C8FF5A"></span><span style="position: absolute; inset: 0; border-radius: 99px; background: #C8FF5A"></span></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #C8FF5A">FOCUS</span>
</div>
<sc-if value="{{ onCall }}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 14px; border-radius: 99px; background: rgba(61,214,140,0.1); border: 1px solid rgba(61,214,140,0.4); font-size: 13px; color: #F2F4F8; white-space: nowrap"><span style="width: 8px; height: 8px; border-radius: 99px; background: #3DD68C; box-shadow: 0 0 10px #3DD68C"></span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #3DD68C">LIVE CALL</span>{{ callLabel }}</span>
<span style="display: flex; align-items: center; gap: 6px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #9AA2B3"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Number hidden · GDPR</span>
</sc-if>
<sc-if value="{{ noCall }}" hint-placeholder-val="{{ true }}"><button type="button" data-dialer-demo style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 99px; border: 1px dashed rgba(200,255,90,0.6); background: rgba(200,255,90,0.06); color: #C8FF5A; font-size: 13px; font-weight: 500"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"></path></svg>Demo: place a call</button></sc-if>
<sc-if value="{{ noCall }}" hint-placeholder-val="{{ true }}"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #7F889B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">{{ idleLabel }}</span></sc-if>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9AA2B3"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M3 3l18 18"></path></svg>Notifications paused</span>
<div style="margin-left: auto; display: flex; align-items: center; gap: 14px">
<span style="font-family: 'Geist Mono', monospace; font-size: 28px; font-weight: 400; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{ clock }}</span>
<sc-if value="{{ onCall }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ endCall }}" style="height: 44px; padding: 0 18px; border-radius: 99px; border: 0; background: #FF5A4E; color: #1A0503; font-size: 13px; font-weight: 600">End call</button></sc-if>
<button type="button" data-dialer-toggle aria-expanded="false" aria-controls="__dial" style="height: 44px; padding: 0 16px; border-radius: 99px; border: 1px solid rgba(200,255,90,0.45); background: transparent; color: #C8FF5A; font-size: 13px; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>Dialer</button>
<button type="button" data-theme-toggle aria-label="Switch between light and dark version" style="width: 44px; height: 44px; flex: 0 0 auto; border-radius: 99px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #C9D0DD; display: flex; align-items: center; justify-content: center"><svg class="th-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><svg class="th-moon" aria-hidden="true" style="display: none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
<button class="ghost" onClick="{{ toggleDrawer }}" aria-expanded="{{ drawerOpen }}" style="height: 44px; padding: 0 16px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #C9D0DD; font-size: 13px; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Tips · {{ tipCount }}</button>
<a href="active-call.html" aria-label="Exit focus mode" style="width: 44px; height: 44px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
</header>

<sc-if value="{{ justConnected }}" hint-placeholder-val="{{ false }}"><div role="status" class="rise" style="position: absolute; z-index: 4; left: 50%; top: 88px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-radius: 99px; background: rgba(61,214,140,0.14); border: 1px solid rgba(61,214,140,0.5); color: #F2F4F8; font-size: 15px; white-space: nowrap"><span style="width: 9px; height: 9px; border-radius: 99px; background: #3DD68C; box-shadow: 0 0 12px #3DD68C"></span>Call connected · {{ callLabel }} · your first line is ready</div></sc-if>
<main style="position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; padding: 8px 24px 40px; text-align: center">

<div aria-hidden="true" style="position: relative; width: 240px; height: 240px; flex: 0 0 auto">
<span class="ripple" style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(200,255,90,0.35)"></span>
<span class="ripple" style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(200,255,90,0.35); animation-delay: 1.3s"></span>
<span class="ripple" style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(200,255,90,0.35); animation-delay: 2.6s"></span>
<svg class="spin" viewBox="0 0 240 240" style="position: absolute; inset: 0; width: 100%; height: 100%">
<sc-for list="{{ ticks }}" as="t" hint-placeholder-count="72"><line x1="{{ t.x1 }}" y1="{{ t.y1 }}" x2="{{ t.x2 }}" y2="{{ t.y2 }}" stroke="{{ t.c }}" stroke-width="2" stroke-linecap="round"></line></sc-for>
</svg>
<div class="breathe" style="position: absolute; inset: 52px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(200,255,90,0.55), rgba(200,255,90,0.12) 55%, rgba(200,255,90,0) 72%)"></div>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<div class="wave" style="display: flex; align-items: center; gap: 3px; height: 30px">
<sc-for list="{{ wave }}" as="b" hint-placeholder-count="9"><span style="{{ b }}"></span></sc-for>
</div>
<span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.24em; color: #E6FFB0">CUSTOMER SPEAKING</span>
</div>
</div>

<div style="{{ riseStyle }}">
<span style="{{ labelStyle }}">{{ label }}</span>
<p aria-live="polite" style="{{ lineStyle }}">{{ tip.pre }}<span style="{{ keyStyle }}">{{ tip.key }}</span>{{ tip.post }}</p>
<sc-if value="{{ showWhy }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; max-width: 640px; font-size: 16px; line-height: 1.55; color: #9AA2B3">{{ tip.why }}</p></sc-if>
</div>

<div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center">
<button onClick="{{ markSaid }}" style="{{ saidStyle }}"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>{{ saidLabel }}</button>
<button class="ghost" onClick="{{ toggleWhy }}" aria-pressed="{{ showWhyStr }}" style="height: 52px; padding: 0 22px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #C9D0DD; font-size: 15px">{{ whyLabel }}</button>
<button onClick="{{ raiseHand }}" style="{{ helpStyle }}"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a8 8 0 0 0 16 0v-2a2 2 0 0 0-4 0"></path></svg>{{ helpLabel }}</button>
</div>

<div style="display: flex; align-items: center; gap: 10px" role="group" aria-label="Recent tips">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="5"><button onClick="{{ d.pick }}" aria-label="{{ d.aria }}" aria-current="{{ d.current }}" style="{{ d.style }}"></button></sc-for>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #7F889B; margin-left: 10px">{{ tip.time }}</span>
<div aria-hidden="true" style="width: 120px; height: 3px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden"><div style="{{ fillStyle }}"></div></div>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #9AA2B3; min-width: 104px; text-align: left">{{ nextLabel }}</span>
<button class="ghost" onClick="{{ togglePause }}" aria-label="{{ pauseAria }}" style="height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #C9D0DD; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.12em">{{ pauseLabel }}</button>
</div>
</main>

<sc-if value="{{ drawer }}" hint-placeholder-val="{{ false }}">
<aside aria-label="Tip history" class="rise" style="position: absolute; z-index: 3; top: 86px; right: 24px; bottom: 24px; width: min(380px, calc(100% - 48px)); box-sizing: border-box; overflow-y: auto; border-radius: 28px; background: rgba(12,14,18,0.96); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 40px 100px rgba(0,0,0,0.7); padding: 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; margin-bottom: 6px"><h2 style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 400; letter-spacing: 0.2em; color: #9AA2B3; margin-right: auto">TIP HISTORY</h2><button class="ghost" onClick="{{ toggleDrawer }}" aria-label="Close tip history" style="width: 36px; height: 36px; border-radius: 99px; border: 0; background: transparent; color: #9AA2B3; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<sc-for list="{{ history }}" as="h" hint-placeholder-count="4">
<button onClick="{{ h.pick }}" style="{{ h.style }}">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #9AA2B3"><span>{{ h.time }}</span><span style="{{ h.badgeStyle }}">{{ h.badge }}</span></span>
<span style="font-size: 15px; line-height: 1.45; color: #F2F4F8">“{{ h.say }}”</span>
<span style="font-size: 13px; line-height: 1.45; color: #9AA2B3">{{ h.why }}</span>
</button>
</sc-for>
</aside>
</sc-if>

<sc-if value="{{ helpRaised }}" hint-placeholder-val="{{ false }}">
<div role="status" class="rise" style="position: absolute; z-index: 3; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 99px; background: rgba(255,194,75,0.12); border: 1px solid rgba(255,194,75,0.4); color: #FFD983; font-size: 14px; white-space: nowrap">
<span style="width: 8px; height: 8px; border-radius: 99px; background: #FFC24B"></span>Supervisor notified — they can whisper to you without the customer hearing.
</div>
</sc-if>
</div>
</template>
<script>
/* Light theme engine: maps every colour in a style declaration to its light-version equivalent.
   Neutrals flip lightness (keeping their slight blue bias), accents keep their hue but get darker
   wherever they are used as text, strokes or borders, so they stay readable on white. */
const __TH = (() => {
  const RE = /#[0-9a-fA-F]{8}\b|#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b|rgba?\([^)]*\)/g;
  const TEXTISH = { 'color': 1, 'stroke': 1, 'fill': 1, 'stop-color': 1, 'caret-color': 1, 'outline': 1, 'outline-color': 1, 'accent-color': 1, '-webkit-text-fill-color': 1 };
  const memo = new Map();
  function parse(c) {
    if (c[0] === '#') {
      let h = c.slice(1);
      if (h.length === 3) h = h.split('').map((x) => x + x).join('');

      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255, a: h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1 };
    }
    const p = c.slice(c.indexOf('(') + 1, -1).split(/[\s,\/]+/).filter(Boolean).map(parseFloat);
    return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
  }
  function hsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    if (mx === mn) return [0, 0, l];
    const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    let h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h / 6, s, l];
  }
  function rgb(h, s, l) {
    if (s === 0) { const v = Math.round(l * 255); return [v, v, v]; }
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = (t) => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return [Math.round(f(h + 1 / 3) * 255), Math.round(f(h) * 255), Math.round(f(h - 1 / 3) * 255)];
  }
  function out(r, g, b, a) { a = Math.round(a * 1000) / 1000; return a >= 1 ? '#' + [r, g, b].map((x) => x.toString(16).padStart(2, '0')).join('') : 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }
  function accentOf(c) { const [, s, l] = hsl(c.r, c.g, c.b); return s > 0.35 && l >= 0.2 && l <= 0.89; }
  function color(str, prop, keepText) {
    const c = parse(str);
    const [h, s, l] = hsl(c.r, c.g, c.b);
    const textish = !!TEXTISH[prop];
    if (s > 0.35 && l >= 0.2 && l <= 0.89) {
      const deg = h * 360;
      if (deg >= 60 && deg <= 110) {
        if (textish) return out(22, 133, 177, c.a < 0.5 ? Math.min(1, c.a * 1.6) : c.a);
        if (prop.indexOf('border') === 0) return out(41, 175, 229, Math.min(1, c.a * 1.25));
        if (prop === 'box-shadow' || prop === 'text-shadow') return out(41, 175, 229, c.a * 0.55);
        return out(41, 175, 229, c.a);
      }
      if (deg > 172 && deg <= 200 && textish) { const [r, g, b] = rgb(172 / 360, Math.min(s, 0.95), Math.min(l, 0.32)); return out(r, g, b, c.a < 0.5 ? Math.min(1, c.a * 1.6) : c.a); }
      if (textish) { const [r, g, b] = rgb(h, Math.min(s, 0.95), Math.min(l, 0.34)); return out(r, g, b, c.a < 0.5 ? Math.min(1, c.a * 1.6) : c.a); }
      if (prop.indexOf('border') === 0) { const [r, g, b] = rgb(h, s, Math.min(l, 0.46)); return out(r, g, b, Math.min(1, c.a * 1.25)); }
      if (prop === 'box-shadow' || prop === 'text-shadow') return out(c.r, c.g, c.b, c.a * 0.55);
      return str;
    }
    if (keepText && textish) return str;
    if (prop === 'box-shadow' && l < 0.3 && c.a < 1) return out(20, 26, 38, c.a * 0.2);
    const [r, g, b] = rgb(h, s, Math.min(0.98, 1 - l));
    return out(r, g, b, c.a);
  }
  function value(v, prop, keepText) { return v.replace(RE, (m) => color(m, prop, keepText)); }
  function block(text) {
    const hit = memo.get(text); if (hit !== undefined) return hit;
    let keep = false;
    const bg = /(?:^|;)\s*background(?:-color)?\s*:\s*([^;]+)/i.exec(text);
    if (bg && !/gradient/i.test(bg[1])) { const c = (bg[1].match(RE) || [])[0]; if (c) { const p = parse(c); if (p.a > 0.9 && accentOf(p)) keep = true; } }
    const res = text.replace(/([a-zA-Z-]+)(\s*:\s*)([^;{}]+)/g, (m, prop, sep, val) => {
      if (!RE.test(val)) { RE.lastIndex = 0; return m; }
      RE.lastIndex = 0;
      return prop + sep + value(val, prop.toLowerCase(), keep);
    });
    if (memo.size > 5000) memo.clear();
    memo.set(text, res);
    return res;
  }
  function css(text) { return text.replace(/\{([^{}]*)\}/g, (m, body) => '{' + block(body) + '}'); }
  function attr(name, v) { return (name === 'style') ? block(v) : (name === 'stroke' || name === 'fill' || name === 'stop-color') ? value(v, name, false) : v; }
  function load() { try { return localStorage.getItem('mycc-theme') === 'light'; } catch (e) { return false; } }
  function save(light) { try { localStorage.setItem('mycc-theme', light ? 'light' : 'dark'); } catch (e) {} }
  return { block, css, attr, value, load, save };
})();

/* Tiny template runtime: renders <template id="tpl"> with {{holes}}, <sc-for>, <sc-if> and on* handlers,
   then patches the live DOM in place so running CSS animations are not restarted on each update. */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch); __render(); }
  forceUpdate() { __render(); }
}
let __comp = null;
let __light = (typeof window.__INIT_THEME === 'string') ? window.__INIT_THEME === 'light' : __TH.load();
const __HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
function __get(path, scope) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  if (path === 'null') return null;
  if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
}
function __whole(v) { const m = v && v.match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/); return m ? m[1] : null; }
function __interp(s, scope) { return s.replace(__HOLE, (_, p) => { const v = __get(p, scope); return v == null ? '' : String(v); }); }
function __bind(el, type) {
  el.__bound = el.__bound || {};
  if (el.__bound[type]) return;
  el.__bound[type] = true;
  el.addEventListener(type, (e) => { const fn = el.__h && el.__h[type]; if (fn) fn(e); });
